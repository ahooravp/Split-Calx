<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- High-res PNG for modern desktop browser tabs -->
<link rel="icon" type="image/png" sizes="32x32" href="/split-calx-logo.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/split-calx-logo.png" />

<!-- Fallback for older browsers -->
<link rel="shortcut icon" href="/split-calx-logo.png" />
    <title>SplitCalx</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (
            theme === "dark" ||
            (!theme &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
